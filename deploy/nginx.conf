# Salin ke server: /etc/nginx/sites-available/landing-digital-marketing
# Ganti DOMAIN_ANDA (2 tempat) dengan domain Anda, misal jasa.wongide.xyz
# Certbot akan menambahkan blok HTTPS otomatis.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    root /var/www/landing-digital-marketing;
    index index.html;

    # Jangan sajikan folder .git dan file deploy
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
    location = /README.md { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Situs ini hanya 1 file HTML: no-cache supaya update langsung terlihat
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
